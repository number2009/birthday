<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday 💖</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #06000f; font-family: Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: block; }
#rain { z-index: 1; transition: opacity 1.4s ease; }
#rain.dim { opacity: 0.35; }
#particles { z-index: 2; pointer-events: none; }

#startOverlay {
  position: fixed;
  inset: 0;
  z-index: 500;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 26px;
  background: radial-gradient(circle at 50% 45%, rgba(60,10,80,.65), rgba(6,0,15,.92));
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  cursor: pointer;
  transition: opacity .8s ease, visibility .8s;
}
#startOverlay.hide { opacity: 0; visibility: hidden; pointer-events: none; }

.calendar {
  width: clamp(200px, 52vw, 260px);
  background: linear-gradient(180deg, #fff 0%, #fff 100%);
  border-radius: 18px;
  overflow: hidden;
  box-shadow:
    0 0 30px rgba(255, 60, 180, .85),
    0 0 70px rgba(170, 60, 255, .6),
    0 20px 40px rgba(0, 0, 0, .55);
  animation: calFloat 2.6s ease-in-out infinite;
  transform-origin: center;
}
@keyframes calFloat {
  0%, 100% { transform: translateY(0) rotate(-1.5deg); }
  50%      { transform: translateY(-10px) rotate(1.5deg); }
}

.cal-top {
  background: linear-gradient(135deg, #ff2e9a, #a855f7);
  color: #fff;
  padding: 12px 10px 10px;
  text-align: center;
  position: relative;
}
.cal-top::before,
.cal-top::after {
  content: '';
  position: absolute;
  top: -9px;
  width: 14px;
  height: 18px;
  background: #fff;
  border-radius: 50%;
  box-shadow: inset 0 2px 4px rgba(0,0,0,.25);
}
.cal-top::before { left: 24%; }
.cal-top::after  { right: 24%; }

.cal-month {
  font-size: clamp(15px, 3.4vw, 19px);
  font-weight: 900;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  text-shadow: 0 2px 6px rgba(0, 0, 0, .3);
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
  padding: 12px 12px 14px;
  background: #fff;
}
.cal-cell {
  aspect-ratio: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(10px, 2.3vw, 13px);
  font-weight: 600;
  color: #2a2030;
  border-radius: 50%;
}
.cal-cell.head {
  font-size: clamp(9px, 2vw, 11px);
  font-weight: 700;
  color: #a855f7;
  text-transform: uppercase;
}
.cal-cell.muted { color: #cfc7d5; }

.cal-cell.mark {
  position: relative;
  color: #e60039 !important;
  font-weight: 900 !important;
  font-size: clamp(13px, 3vw, 17px) !important;
}
.cal-cell.mark::before {
  content: '';
  position: absolute;
  inset: -3px;
  border: 2.5px solid #e60039;
  border-radius: 50%;
  box-shadow:
    0 0 10px rgba(230, 0, 57, .9),
    inset 0 0 8px rgba(230, 0, 57, .35);
  animation: markPulse 1.6s ease-in-out infinite;
}
@keyframes markPulse {
  0%, 100% { transform: scale(1);    box-shadow: 0 0 10px rgba(230, 0, 57, .9), inset 0 0 8px rgba(230, 0, 57, .35); }
  50%      { transform: scale(1.12); box-shadow: 0 0 18px rgba(230, 0, 57, 1),  inset 0 0 14px rgba(230, 0, 57, .55); }
}

.start-title {
  font-size: clamp(20px, 4.6vw, 32px);
  font-weight: 900;
  color: #fff;
  letter-spacing: 2px;
  text-align: center;
  padding: 0 24px;
  text-shadow: 0 0 16px #ff2e9a, 0 0 40px #a855f7;
  animation: startGlow 2.4s ease-in-out infinite;
}
@keyframes startGlow {
  0%, 100% { text-shadow: 0 0 16px #ff2e9a, 0 0 40px #a855f7; }
  50%      { text-shadow: 0 0 26px #ff2e9a, 0 0 70px #a855f7; }
}

#bookStage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; opacity: 0; pointer-events: none; transition: opacity 1s ease; perspective: 2600px; }
#bookStage.active { opacity: 1; pointer-events: auto; }
.book { position: relative; width: min(90vw, 820px); height: min(60vh, 500px); transform-style: preserve-3d; transition: transform 1.4s cubic-bezier(.6,.05,.3,1), opacity .9s ease .3s; }
.static-left, .static-right { position: absolute; top: 0; width: 50%; height: 100%; overflow: hidden; background: #16071f; z-index: 0; box-shadow: 0 0 60px rgba(200,60,180,.35), 0 20px 50px rgba(0,0,0,.6); }
.static-left  { left: 0;  border-radius: 14px 0 0 14px; }
.static-right { right: 0; border-radius: 0 14px 14px 0; }
.leaf { position: absolute; top: 0; left: 50%; width: 50%; height: 100%; transform-origin: left center; transform-style: preserve-3d; transition: transform 1.15s cubic-bezier(.5,.05,.25,1); will-change: transform; }
.leaf.flipped { transform: rotateY(-180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; background: #1a0822; display: flex; align-items: center; justify-content: center; }
.face.front { border-radius: 0 14px 14px 0; }
.face.back  { transform: rotateY(180deg); border-radius: 14px 0 0 14px; }
.photo-frame { position: absolute; inset: 14px; border-radius: 10px; overflow: hidden; border: 2px solid rgba(255,110,200,.55); box-shadow: 0 0 26px rgba(255,60,180,.4), inset 0 0 40px rgba(0,0,0,.5); background: linear-gradient(135deg, #ff2e9a, #a855f7); }
.photo-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.back-cover { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(circle at 50% 40%, #2a0a38, #12041a); }
.bc-heart { font-size: clamp(48px, 10vw, 90px); animation: bcBeat 1.6s ease-in-out infinite; filter: drop-shadow(0 0 24px rgba(255,60,180,.9)); }
@keyframes bcBeat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.22); } 30% { transform: scale(1); } 45% { transform: scale(1.16); } }
.bc-text { font-weight: 900; font-size: clamp(13px, 2.4vw, 20px); letter-spacing: 3px; text-transform: uppercase; color: #ff8ad8; text-shadow: 0 0 18px rgba(255,60,180,.9); text-align: center; padding: 0 20px; }
.book-hint { font-size: 12px; letter-spacing: 3px; color: rgba(255,140,220,.75); text-transform: uppercase; animation: hintPulse 2s ease-in-out infinite; }
@keyframes hintPulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }

#heartStage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 11; opacity: 0; pointer-events: none; transition: opacity 1.2s ease; }
#heartStage.active { opacity: 1; }
#heartContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

.center-photo {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) scale(0);
  width: var(--cpw);
  height: var(--cph);
  opacity: 0;
  z-index: 1;
  animation: cpIn 1.2s cubic-bezier(.34,1.56,.64,1) 1.4s forwards;
  pointer-events: none;
}
.center-photo-inner {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  border: 4px solid #fff;
  box-shadow:
    0 0 30px rgba(255,60,180,1),
    0 0 70px rgba(170,60,255,.9),
    0 0 120px rgba(255,60,180,.6),
    inset 0 0 40px rgba(255,60,180,.35);
  animation: cpPulse 2.4s ease-in-out 2.6s infinite;
}
.center-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
@keyframes cpIn {
  0%   { transform: translate(-50%, -50%) scale(0) rotate(-180deg); opacity: 0; }
  70%  { transform: translate(-50%, -50%) scale(1.15) rotate(8deg); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
}
@keyframes cpPulse {
  0%, 100% { box-shadow: 0 0 30px rgba(255,60,180,1), 0 0 70px rgba(170,60,255,.9), 0 0 120px rgba(255,60,180,.6), inset 0 0 40px rgba(255,60,180,.35); }
  50%      { box-shadow: 0 0 45px rgba(255,60,180,1), 0 0 100px rgba(170,60,255,1), 0 0 160px rgba(255,60,180,.85), inset 0 0 55px rgba(255,60,180,.5); }
}
.center-photo::before,
.center-photo::after {
  content: '💖';
  position: absolute;
  font-size: 22px;
  filter: drop-shadow(0 0 10px #ff2e9a);
  animation: orbit 4s linear infinite;
}
.center-photo::before { top: -12px; left: 50%; transform: translateX(-50%); }
.center-photo::after  { bottom: -12px; left: 50%; transform: translateX(-50%); animation-delay: -2s; }
@keyframes orbit {
  0%   { transform: translateX(-50%) rotate(0deg); }
  100% { transform: translateX(-50%) rotate(360deg); }
}

.heart-photo {
  position: absolute;
  width: var(--pw);
  height: var(--ph);
  margin-left: calc(var(--pw) / -2);
  margin-top: calc(var(--ph) / -2);
  opacity: 0;
  transform: scale(0) rotate(200deg);
  animation: hpPop .9s cubic-bezier(.34,1.56,.64,1) forwards;
  border-radius: 8px;
  z-index: 10;
}
.heart-photo img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 8px; border: 2px solid rgba(255,130,210,.9); box-shadow: 0 0 16px rgba(255,60,180,.85), 0 0 38px rgba(170,60,255,.5); }
@keyframes hpPop { 0% { opacity: 0; transform: scale(0) rotate(200deg); } 60% { opacity: 1; transform: scale(1.15) rotate(-8deg); } 100% { opacity: 1; transform: scale(1) rotate(0deg); } }

.final-title { position: absolute; left: 0; right: 0; top: 4vh; text-align: center; font-size: clamp(20px, 4.2vw, 44px); font-weight: 900; color: #fff; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 12px #ff2e9a, 0 0 30px #a855f7; opacity: 0; transform: translateY(-30px); animation: fIn 1.5s cubic-bezier(.2,.8,.3,1) .3s forwards, fGlow 2.4s ease-in-out 2s infinite; z-index: 20; pointer-events: none; }
@keyframes fIn { to { opacity: 1; transform: translateY(0); } }
@keyframes fGlow { 0%, 100% { text-shadow: 0 0 12px #ff2e9a, 0 0 30px #a855f7; } 50% { text-shadow: 0 0 20px #ff2e9a, 0 0 50px #a855f7; } }
.final-subtitle { position: absolute; left: 0; right: 0; bottom: 3vh; text-align: center; font-size: clamp(14px, 2.6vw, 21px); color: #ffd6f0; text-shadow: 0 0 14px rgba(255,60,180,.9), 0 0 30px rgba(170,60,255,.6); line-height: 1.75; opacity: 0; transform: translateY(20px); animation: fIn 1.5s cubic-bezier(.2,.8,.3,1) 1.1s forwards; z-index: 20; pointer-events: none; padding: 0 20px; }
.floating-heart { position: absolute; bottom: -40px; font-size: 20px; animation: floatHeart linear forwards; pointer-events: none; filter: drop-shadow(0 0 10px rgba(255,60,180,.9)); z-index: 20; }
@keyframes floatHeart { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }
.sparkle { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 12px #fff, 0 0 24px #ff2e9a, 0 0 36px #a855f7; animation: sparkAnim 2s ease-out forwards; pointer-events: none; z-index: 20; }
@keyframes sparkAnim { 0% { transform: scale(0); opacity: 1; } 50% { transform: scale(1.6); opacity: 1; } 100% { transform: scale(0); opacity: 0; } }
.center-beat { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: clamp(60px, 14vw, 150px); opacity: 0; pointer-events: none; z-index: 0; filter: drop-shadow(0 0 18px rgba(255, 60, 180, 0.55)) drop-shadow(0 0 40px rgba(170, 60, 255, 0.35)); animation: centerIn 1.5s ease .8s forwards, centerPulse 2.2s ease-in-out 2.3s infinite; }
@keyframes centerIn { to { opacity: .06; } }
@keyframes centerPulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.12); } }
</style>
</head>

<script>
"use strict";

window.onerror = function (msg, url, line, col) {
  var div = document.createElement('div');
  div.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#000;color:#f0f;padding:20px;font-family:monospace;font-size:14px;white-space:pre-wrap;overflow:auto;';
  div.textContent = 'ОШИБКА: ' + msg + '\n\nСтрока: ' + line + ':' + col;
  document.body.appendChild(div);
};

(function () {

// ============================================================
//  ФОТОГРАФИИ
// ============================================================
var USER_PHOTOS = [
  'https://sun9-38.vkuserphoto.ru/s/v1/ig2/QC04fJ7uQ8AQME00de6Ya5-11u8nCARU9sHEIPmrc3-gicOvqthsTv8MH75C6QB7JskUb1NM5zdkcT4ViNuWzi_5yqUVsg.jpg?quality=95&as=32x57,48x85,72x128,108x192,160x284,240x427,360x640,480x853,540x960,640x1138,720x1280,1080x1920,1206x2144&from=bu&u=LNso77hh8Zylor5r2GH0q4IIffGhk9JTbwnGj85JRcs&cs=540x0',

function photoURL(i) {
  if (!USER_PHOTOS.length) return '';
  return USER_PHOTOS[i % USER_PHOTOS.length];
}

var audioCtx = null;

function initAudio() {
  if (audioCtx && audioCtx.state === 'running') return true;
  if (!audioCtx) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return true;
}

function playTick(volume) {
  if (!audioCtx) return;
  var now = audioCtx.currentTime;

  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(2200, now);
  osc.frequency.exponentialRampToValueAtTime(1200, now + 0.035);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(volume, now + 0.003);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now); osc.stop(now + 0.1);

  var osc2 = audioCtx.createOscillator();
  var gain2 = audioCtx.createGain();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(450, now);
  osc2.frequency.exponentialRampToValueAtTime(110, now + 0.06);
  gain2.gain.setValueAtTime(0.0001, now);
  gain2.gain.exponentialRampToValueAtTime(volume * 0.75, now + 0.005);
  gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
  osc2.connect(gain2);
  gain2.connect(audioCtx.destination);
  osc2.start(now); osc2.stop(now + 0.14);
}

function playPluck(freq, startTime, duration, volume) {
  if (!audioCtx) return;

  var osc1 = audioCtx.createOscillator();
  var osc2 = audioCtx.createOscillator();
  var osc3 = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  var filter = audioCtx.createBiquadFilter();

  osc1.type = 'triangle';
  osc1.frequency.value = freq;
  osc2.type = 'sine';
  osc2.frequency.value = freq * 2.0;
  osc3.type = 'sine';
  osc3.frequency.value = freq * 3.0;

  var g2 = audioCtx.createGain(); g2.gain.value = 0.25;
  var g3 = audioCtx.createGain(); g3.gain.value = 0.10;

  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(3200, startTime);
  filter.frequency.exponentialRampToValueAtTime(650, startTime + duration);
  filter.Q.value = 1.2;

  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.exponentialRampToValueAtTime(volume, startTime + 0.008);
  gain.gain.exponentialRampToValueAtTime(volume * 0.35, startTime + 0.25);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

  osc1.connect(filter);
  osc2.connect(g2); g2.connect(filter);
  osc3.connect(g3); g3.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  osc1.start(startTime); osc1.stop(startTime + duration + 0.1);
  osc2.start(startTime); osc2.stop(startTime + duration + 0.1);
  osc3.start(startTime); osc3.stop(startTime + duration + 0.1);
}

var NOTE = {

  'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99,
  'A5': 880.00
};

var CHORDS = [
  ['A2', 'E3', 'A3', 'C4', 'E4', 'C4', 'A3', 'E3'],
  ['F2', 'C3', 'F3', 'A3', 'C4', 'A3', 'F3', 'C3'],
  ['C3', 'G3', 'C4', 'E4', 'G4', 'E4', 'C4', 'G3'],
  ['G2', 'D3', 'G3', 'B3', 'D4', 'B3', 'G3', 'D3']
];

var NOTE_STEP = 0.24;
var CHORD_GAP = 0.15;
var MUSIC_VOL = 0.16;

var musicOn = false;
var musicTimer = null;

function scheduleMusicLoop() {
  if (!musicOn || !audioCtx) return;

  var now = audioCtx.currentTime + 0.08;
  var t = now;

  for (var c = 0; c < CHORDS.length; c++) {
    var chord = CHORDS[c];
    for (var i = 0; i < chord.length; i++) {
      var freq = NOTE[chord[i]];
      if (freq) {
        var isBass = (i === 0);
        var vol = isBass ? MUSIC_VOL * 1.35 : MUSIC_VOL;
        var dur = isBass ? 2.1 : 1.4;
        playPluck(freq, t, dur, vol);
      }
      t += NOTE_STEP;
    }
    t += CHORD_GAP;
  }

  var loopDur = t - now;
  musicTimer = setTimeout(scheduleMusicLoop, loopDur * 1000);
}

function startMusic() {
  if (musicOn) return;
  musicOn = true;
  scheduleMusicLoop();
}

var CHARS = 'HAPPYHAPPYHAPPYHAPPYHAPPYHAPPYBIRTHDAYLOVE♥❤✦♡';
var NEON  = ['#ff2e9a', '#ff5fbf', '#ff8ad8', '#c855ff', '#a855f7', '#e879f9', '#d946ef'];
var FONT_SIZE = 16;
var drops = [], speeds = [], colColors = [];

function initRain() {
  FONT_SIZE = W < 640 ? 13 : 16;
  var cols = Math.ceil(W / FONT_SIZE) + 1;
  drops = []; speeds = []; colColors = [];
  for (var i = 0; i < cols; i++) {
    drops.push(Math.random() * (H / FONT_SIZE));
    speeds.push(0.08 + Math.random() * 0.34);
    colColors.push(NEON[Math.floor(Math.random() * NEON.length)]);
  }
}

function rainFrame() {
  rainCtx.fillStyle = 'rgba(6, 0, 15, 0.055)';
  rainCtx.fillRect(0, 0, W, H);
  rainCtx.font = 'bold ' + FONT_SIZE + 'px "Courier New", monospace';
  rainCtx.textAlign = 'center';
  rainCtx.textBaseline = 'middle';
  for (var i = 0; i < drops.length; i++) {
    var x = i * FONT_SIZE + FONT_SIZE / 2;
    var y = drops[i] * FONT_SIZE;
    if (y > -FONT_SIZE && y < H + FONT_SIZE) {
      var ch = CHARS.charAt(Math.floor(Math.random() * CHARS.length));
      rainCtx.fillStyle = colColors[i];
      rainCtx.globalAlpha = 0.4;
      rainCtx.fillText(ch, x, y);
      rainCtx.globalAlpha = 1;
      rainCtx.fillStyle = '#ffffff';
      rainCtx.fillText(ch, x, y);
      rainCtx.globalAlpha = 0.85;
      rainCtx.fillStyle = colColors[i];
      rainCtx.fillText(ch, x, y);
      rainCtx.globalAlpha = 1;
    }
    drops[i] += speeds[i];
    if (y > H + FONT_SIZE && Math.random() > 0.97) {
      drops[i] = -Math.random() * 30 - 2;
      speeds[i] = 0.08 + Math.random() * 0.34;
      colColors[i] = NEON[Math.floor(Math.random() * NEON.length)];

}

var P_COLORS = ['#ff2e9a', '#ff5fbf', '#ff8ad8', '#c855ff', '#a855f7', '#e879f9', '#ffffff'];
var particles = [];
var pulseOn = false;
var pulseT = 0;

function makeParticle() {
  return {
    x: Math.random() * W, y: Math.random() * H - H,
    vx: 0, vy: 0, tx: 0, ty: 0,
    active: false, dead: false, alpha: 1,
    size: 2.8 + Math.random() * 2.2,
    color: P_COLORS[Math.floor(Math.random() * P_COLORS.length)]
  };
}

function updateParticles() {
  pulseT += 0.05;
  var pulse = 1 + Math.sin(pulseT) * 0.010;
  pCtx.clearRect(0, 0, W, H);
  pCtx.globalCompositeOperation = 'lighter';
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    if (p.active) {
      var tx = p.tx, ty = p.ty;
      if (pulseOn) { tx = W / 2 + (p.tx - W / 2) * pulse; ty = H / 2 + (p.ty - H / 2) * pulse; }
      p.vx += (tx - p.x) * 0.065; p.vy += (ty - p.y) * 0.065;
      p.vx *= 0.84; p.vy *= 0.84;
    } else {
      p.vy += 0.06; p.vx *= 0.99; p.vy *= 0.99;
    }
    p.x += p.vx; p.y += p.vy;
    if (p.dead) { p.alpha -= 0.028; if (p.alpha <= 0) { particles.splice(i, 1); continue; } }
    pCtx.globalAlpha = p.alpha * 0.22;
    pCtx.fillStyle = p.color;
    pCtx.fillRect(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
    pCtx.globalAlpha = p.alpha;
    pCtx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    pCtx.globalAlpha = p.alpha * 0.9;
    pCtx.fillStyle = '#ffffff';
    pCtx.fillRect(p.x - p.size * 0.22, p.y - p.size * 0.22, p.size * 0.44, p.size * 0.44);
  }
  pCtx.globalAlpha = 1;
  pCtx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(updateParticles);
}

function morphTo(points) {
  var live = [];
  for (var i = 0; i < particles.length; i++) if (!particles[i].dead) live.push(particles[i]);
  var need = points.length - live.length;
  if (need > 0) {
    for (var k = 0; k < need; k++) {
      var p = makeParticle();
      if (Math.random() < 0.5) p.y = -40 - Math.random() * 200; else p.y = H + 40 + Math.random() * 200;
      p.x = Math.random() * W;
      particles.push(p);
    }
  } else if (need < 0) {
    for (var j = 0; j < -need; j++) {
      var v = live[live.length - 1 - j];
      if (v) { v.dead = true; v.active = false; v.vx = (Math.random() - 0.5) * 16; v.vy = (Math.random() - 0.5) * 16; }
    }
  }
  var nowLive = [];
  for (var m = 0; m < particles.length; m++) if (!particles[m].dead) nowLive.push(particles[m]);
  var shuffled = points.slice();
  for (var s = shuffled.length - 1; s > 0; s--) {
    var r = Math.floor(Math.random() * (s + 1));
    var tmp = shuffled[s]; shuffled[s] = shuffled[r]; shuffled[r] = tmp;
  }
  for (var n = 0; n < nowLive.length; n++) {
    var pt = shuffled[n % shuffled.length];
    nowLive[n].tx = pt.x; nowLive[n].ty = pt.y; nowLive[n].active = true;
  }
}

function explode() {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    if (p.dead) continue;
    p.active = false;
    var a = Math.random() * Math.PI * 2;
    var s = 4 + Math.random() * 12;
    p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s - 2;
  }
}

function collectPoints(data, gap) {
  var pts = [];
  for (var y = 0; y < H; y += gap) {
    for (var x = 0; x < W; x += gap) {
      if (data[(y * W + x) * 4 + 3] > 128) pts.push({ x: x, y: y });
    }
  }
  return pts;
}

function textToPoints(lines, fontSize, lineGap, target) {
  target = target || (W < 640 ? 700 : 1400);
  var off = document.createElement('canvas');
  off.width = W; off.height = H;
  var c = off.getContext('2d');
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = '900 ' + fontSize + 'px Arial, "Segoe UI", sans-serif';
  var totalH = (lines.length - 1) * lineGap;
  var startY = H / 2 - totalH / 2;
  for (var i = 0; i < lines.length; i++) c.fillText(lines[i], W / 2, startY + i * lineGap);
  var data = c.getImageData(0, 0, W, H).data;
  var gap = Math.max(2, Math.round(fontSize / 30));
  var pts = collectPoints(data, gap);
  var iter = 0;
  while (pts.length > target * 1.15 && gap < 40 && iter++ < 25) { gap++; pts = collectPoints(data, gap); }
  iter = 0;
  while (pts.length < target * 0.85 && gap > 2 && iter++ < 25) { gap--; pts = collectPoints(data, gap); }
  return pts;
}

function heartFill(target) {
  var pts = []; var cx = W / 2; var cy = H / 2;
  var S = Math.min(W * 0.32, H * 0.28);
  var attempts = 0, limit = target * 130;
  while (pts.length < target && attempts < limit) {
    attempts++;
    var x = Math.random() * 2.6 - 1.3;
    var y = Math.random() * 2.6 - 1.3;
    var a = x * x + y * y - 1;
    if (a * a * a - x * x * y * y * y <= 0) pts.push({ x: cx + x * S, y: cy - y * S });
  }
  return pts;
}

var heartStage = document.getElementById('heartStage');

function heartOutlinePoints(n, S, cx, cy) {
  var steps = 1200; var raw = [];
  for (var i = 0; i <= steps; i++) {
    var t = (i / steps) * Math.PI * 2;
    var x = 16 * Math.pow(Math.sin(t), 3);
    var y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    raw.push({ x: x, y: -y });
  }
  var cum = [0];
  for (var k = 1; k <= steps; k++) {
    var dx = raw[k].x - raw[k - 1].x, dy = raw[k].y - raw[k - 1].y;
    cum.push(cum[k - 1] + Math.sqrt(dx * dx + dy * dy));
  }
  var total = cum[steps]; var out = [];
  for (var j = 0; j < n; j++) {
    var target = (j / n) * total;
    var lo = 0, hi = steps;
    while (lo < hi) {
      var mid = (lo + hi) >> 1;
      if (cum[mid] < target) lo = mid + 1; else hi = mid;
    }
    var p = raw[lo];
    out.push({ x: cx + p.x * S / 16, y: cy + p.y * S / 16 });
  }
  return out;
}
